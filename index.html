<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>태초의 지도 - Genesis Atlas</title>
<link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%231b5e9a%27/%3E%3Cpath d=%27M8 12q4-5 8-1t8 3-2 8-8 2-6-6z%27 fill=%27%2373b84f%27/%3E%3C/svg%3E"></head>
<body>
<canvas id="map"></canvas>
<div id="top">
  <div id="yr"><b id="year">-</b><span id="era"></span></div>
  <div id="stats"><span id="spop"></span><span id="snat"></span><span id="swar"></span></div>
  <div id="speed"></div>
  <div id="modes"></div>
  <button id="menuBtn" title="패널">☰</button>
</div>
<div id="panel"><button id="panelHandle" title="패널 접기" aria-label="패널 접기/펼치기">▶</button><div id="tabs"></div><div id="tabBody"></div></div>
<div id="toast"></div>
<div id="start"><div class="card">
  <h1>태초의 지도</h1><div class="sub">Genesis Atlas · 끝없이 지켜보는 문명 시뮬레이터</div>
  <label>지도<select id="selMap"></select></label>
  <label>시작 방식<select id="selMode"><option value="real" selected>시대별 세계 - 역사 속 실제 나라로 시작 (지구 전용)</option><option value="emergent">태초부터 - 부족에서 문명이 자라납니다</option></select></label>
  <label id="eraRow">시대<select id="selEra"></select></label>
  <div class="row"><label>시드<input id="seed" type="number" value="1"></label><label>씨앗 부족 수<input id="hearths" type="number" min="2" max="14" value="6"></label></div>
  <label>호전성<select id="aggr"><option value="0.6">평화로움</option><option value="1" selected>보통</option><option value="1.5">호전적</option></select></label>
  <button id="go" class="primary">시작하기</button>
  <button id="cont" class="hide">이어하기 (자동 저장)</button>
  <div id="loadmsg"></div>
  <p class="fine">지구 경계는 Natural Earth 근사이고, 시대별 세계는 historical-basemaps(GPL-3.0) 스냅샷을 근사 배치한 시작 시나리오입니다. 역사 재현이 아니라 이후 전개는 대체 역사입니다.</p>
</div></div>
<script type="module" src="js/main.js"></script>
</body></html>
